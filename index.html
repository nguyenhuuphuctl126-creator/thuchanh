<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- a-scene là khung hình AR, arjs tự động kích hoạt camera -->
    <a-scene embedded arjs="sourceType: webcam;">
        
        <!-- Định nghĩa marker HIRO, phần mềm sẽ tự quét chữ HIRO -->
        <a-marker preset="hiro">
            
            <!-- Tải mô hình .glb của bạn -->
            <!-- scale để chỉnh độ to nhỏ, rotation để xoay mô hình -->
            <a-entity 
                gltf-model="url(model.glb)" 
                scale="1 1 1" 
                rotation="0 0 0">
            </a-entity>
            
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
