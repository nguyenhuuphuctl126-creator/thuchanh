<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@3.2.1/dist/aframe-animation-component.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
        <a-entity light="type: directional; intensity: 0.8; position: 1 1 1"></a-entity>

        <a-marker preset="hiro">
            <a-entity 
                gltf-model="url(model.glb)" 
                scale="0.7 0.7 0.7" 
                rotation="0 0 0"
                animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;"
                animation__float="property: position; to: 0 0.2 0; dur: 2000; dir: alternate; loop: true; easing: easeInOutQuad;">
            </a-entity>
            
            <a-plane position="0 0 1" rotation="-90 0 0" width="2" height="0.8" color="#000" opacity="0.6">
                <a-text value="Mo hinh 1\nSinh vat thu vi" align="center" scale="0.8 0.8 0.8" position="0 0 0.1"></a-text>
            </a-plane>
        </a-marker>

        <a-marker preset="kanji">
            <a-entity 
                gltf-model="url(model2.glb)" 
                scale="0.05 0.05 0.05" 
                rotation="0 0 0"
                animation__rotate="property: rotation; to: 0 -360 0; loop: true; dur: 10000; easing: linear;"
                animation__float="property: position; to: 0 0.2 0; dur: 2000; dir: alternate; loop: true; easing: easeInOutQuad;">
            </a-entity>
            
            <a-plane position="0 0 1" rotation="-90 0 0" width="2.5" height="0.8" color="#228B22" opacity="0.7">
                <a-text value="Te bao thuc vat\nCau truc sinh hoc" align="center" scale="0.8 0.8 0.8" position="0 0 0.1"></a-text>
            </a-plane>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
